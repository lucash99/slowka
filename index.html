<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Słówka</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Słówka">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F4F6; --card:#FFFFFF; --ink:#1A2030; --muted:#5C6577; --line:#D6DAE2;
  --accent:#2C4B85; --on-accent:#FFFFFF; --soft:#E6ECF6;
  --again:#B3261E; --hard:#96610A; --good:#2E7A45; --easy:#2C63B5; --ring:#1A2030;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#12151C; --card:#1C2029; --ink:#E7EAF0; --muted:#A0A8B8; --line:#303644;
    --accent:#9DB8E8; --on-accent:#12151C; --soft:#252C3B;
    --again:#F08A80; --hard:#E5B567; --good:#6CC488; --easy:#86B4F2; --ring:#E7EAF0;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.5}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
h1,h2,.display{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;line-height:1.1}
h1{font-size:1.65rem;margin:0 0 16px}
h2{font-size:1.25rem;margin:0 0 10px}

#app{max-width:560px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom))}
#tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);z-index:5}
#tabs div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
#tabs button{background:none;border:0;padding:14px 4px;font-weight:500;color:var(--muted);min-height:52px}
#tabs button[aria-current=page]{color:var(--accent);font-weight:600;box-shadow:inset 0 2px 0 var(--accent)}

.counts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.counts div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;text-align:center}
.counts b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:1.6rem;line-height:1.1}
.counts span{font-size:.82rem;color:var(--muted)}

.flash{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;min-height:260px;
  display:flex;flex-direction:column}
.dir{font-size:.8rem;font-weight:600;letter-spacing:.04em;color:var(--muted)}
.prompt{display:flex;align-items:center;justify-content:center;gap:10px;flex:1;text-align:center;padding:24px 0;flex-wrap:wrap}
.prompt .display{font-size:2.5rem;overflow-wrap:anywhere}
.answer{border-top:1px solid var(--line);padding-top:16px;text-align:center}
.answer .main{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.9rem;line-height:1.15;overflow-wrap:anywhere;
  display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap}
.meta{color:var(--muted);font-size:.95rem;margin:8px 0 0}
.example{font-style:italic}
.speak{background:none;border:1px solid var(--line);border-radius:50%;width:40px;height:40px;display:inline-grid;place-items:center;color:var(--muted);flex:none;padding:0}
.speak svg{width:20px;height:20px;fill:currentColor}

.primary,.secondary,.danger{border-radius:10px;padding:13px 18px;font-weight:600;border:1px solid transparent;min-height:50px}
.primary{background:var(--accent);color:var(--on-accent)}
.secondary{background:var(--card);border-color:var(--line)}
.danger{background:none;border-color:var(--again);color:var(--again)}
.primary:disabled{opacity:.55;cursor:default}
.wide{width:100%}
.actions{margin-top:12px}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grades button{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:10px;padding:10px 2px;min-height:64px;font-weight:600;color:var(--c)}
.grades small{display:block;font-weight:400;font-size:.82rem;color:var(--muted)}
.link{background:none;border:0;padding:10px 4px;color:var(--muted);text-decoration:underline;font-size:.95rem}
.center{text-align:center}
.empty{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:32px 20px;text-align:center}
.empty p{color:var(--muted);margin:6px 0 18px}

label.field{display:block;margin-bottom:14px}
label.field>span{display:block;font-weight:500;margin-bottom:4px}
input[type=text],input[type=password],input[type=search],input[type=number],textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:17px}
textarea{resize:vertical;min-height:76px}
.row{display:flex;gap:8px}
.row input{flex:1;min-width:0}
.row button{flex:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0}
.chips:empty{display:none}
.chips button{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:6px 13px;min-height:36px}
.chips button[aria-pressed=true]{background:var(--soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.hint{font-size:.9rem;color:var(--muted);margin:6px 0 0}
.hint.bad{color:var(--again)}
.hint a{color:inherit}
.formbtns{display:flex;gap:8px;flex-wrap:wrap}
.formbtns .primary{flex:1}

.list{list-style:none;margin:12px 0 0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.list li+li{border-top:1px solid var(--line)}
.list button{width:100%;background:none;border:0;text-align:left;padding:12px 14px;display:block}
.list b{font-weight:600}
.list .tr{color:var(--muted)}
.list small{display:block;color:var(--muted);font-size:.82rem;margin-top:2px}

section.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.check{display:flex;gap:10px;align-items:flex-start}
.check input{width:20px;height:20px;margin-top:3px;flex:none}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=number]{max-width:120px}
.backup{display:flex;gap:8px;flex-wrap:wrap}

#toast{position:fixed;left:16px;right:16px;bottom:calc(72px + env(safe-area-inset-bottom));max-width:528px;margin:0 auto;
  background:var(--ink);color:var(--paper);padding:11px 15px;border-radius:10px;opacity:0;transform:translateY(8px);
  transition:opacity .18s,transform .18s;pointer-events:none;z-index:10;text-align:center}
#toast.show{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<main id="app"></main>
<nav id="tabs" aria-label="Główne"><div></div></nav>
<div id="toast" role="status" aria-live="polite"></div>
<script src="fsrs.js"></script>
<script src="app.js"></script>
</body>
</html>
